spring:
  application:
    name: hr-attendance-system
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hr_system?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:boda@2005}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update        # use Flyway/Liquibase + "validate" in production
    properties:
      hibernate:
        format_sql: true

server:
  port: 8080

jwt:
  # Base64-encoded key, at least 256 bits. Override with the JWT_SECRET env var in every real environment.
  secret: ${JWT_SECRET:nEYQZL9foTI6X0+h2kKyoTUT+MjAUqelBTiG23jxPyQ=}
  expiration-ms: 86400000      # 24h

adms:
  # Comma-separated device serial numbers allowed to push data. Empty = accept any device.
  allowed-serials: ${ADMS_ALLOWED_SERIALS:}

app:
  cors:
    allowed-origins: ${CORS_ORIGINS:http://localhost:5173}
  bootstrap:
    admin-email: ${ADMIN_EMAIL:admin@company.com}
    admin-password: ${ADMIN_PASSWORD:ChangeMe123!}
